plugins {
    id 'com.android.application'
}

android {
    namespace 'com.veil.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.veil.launcher'
        minSdk 23
        targetSdk 34
        versionCode 232
        versionName '2.2.2'
    }

    // Two packages, one codebase. As of v2.1.2 the wallpapers are ONLINE-ONLY by owner's call:
    //   the 24 bundled aerial stills were removed, so neither flavor ships any wallpaper pictures
    //   except the single offline safety net default_wallpaper.jpg (app/src/{full,lite}/assets).
    //   Bing, 360, Apple aerial video and Wallhaven all fetch live from the network now.
    //   full / lite are kept only for the handed-over APK naming (Veil-TV-full / Veil-TV-lite);
    //   their asset folders are now identical, so the two APKs are the same size.
    flavorDimensions 'bundle'
    productFlavors {
        full {
            dimension 'bundle'
        }
        lite {
            dimension 'bundle'
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The Cards JVM tests exercise real code paths that call android.util.Log; without this
    // every android.* call throws "not mocked" and the whole suite dies before asserting
    // anything (discovered 11-10: the 42 tests had never actually been run).
    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }
}

// Clear product names: the sideloaded APKs are handed to the owner as Veil-TV-full.apk / Veil-TV-lite.apk.
androidComponents {
    onVariants(selector().all()) { variant ->
        def flavor = variant.productFlavors.collect { it.second }.join()
        variant.outputs.forEach { output ->
            output.outputFileName.set("Veil-TV-${flavor}-${variant.buildType}.apk")
        }
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // FileProvider: serves the downloaded update APK to the system installer on API 24+.
    // 1.10.1 is already in the Gradle cache (transitively via recyclerview), so no download.
    implementation 'androidx.core:core:1.10.1'
    // ExoPlayer: streams the aerials instead of MediaPlayer. Some TV ROMs (TCL mt5879) ship a
    // vendor MediaPlayer whose HTTP source signals EOS right after fetching the tail-side moov
    // atom, so non-fast-start MP4s (every Apple aerial) prepare but never render a frame.
    // ExoPlayer's progressive source re-opens the tail range for the moov and then reads the
    // mdat from offset 0, which is exactly what these files need.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
