plugins {
    id 'com.android.application'
}

android {
    namespace 'com.veil.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.veil.launcher'
        minSdk 23
        targetSdk 34
        versionCode 214
        versionName '2.1.3'
    }

    // Two packages, one codebase. As of v2.1.2 the wallpapers are ONLINE-ONLY by owner's call:
    //   the 24 bundled aerial stills were removed, so neither flavor ships any wallpaper pictures
    //   except the single offline safety net default_wallpaper.jpg (app/src/{full,lite}/assets).
    //   Bing, 360, Apple aerial video and Wallhaven all fetch live from the network now.
    //   full / lite are kept only for the handed-over APK naming (Veil-TV-full / Veil-TV-lite);
    //   their asset folders are now identical, so the two APKs are the same size.
    flavorDimensions 'bundle'
    productFlavors {
        full {
            dimension 'bundle'
        }
        lite {
            dimension 'bundle'
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Clear product names: the sideloaded APKs are handed to the owner as Veil-TV-full.apk / Veil-TV-lite.apk.
androidComponents {
    onVariants(selector().all()) { variant ->
        def flavor = variant.productFlavors.collect { it.second }.join()
        variant.outputs.forEach { output ->
            output.outputFileName.set("Veil-TV-${flavor}-${variant.buildType}.apk")
        }
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
